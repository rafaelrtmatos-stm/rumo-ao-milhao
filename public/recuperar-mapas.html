<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recuperar mapas — Rumo ao Milhão</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --fg:#e8eaf0; --mut:#9aa3b2; --ok:#3ddc84; --err:#ff6b6b; --card:#181b22; --bd:#272c36; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --fg:#12151b; --mut:#5c6472; --card:#fff; --bd:#e2e5ea; } }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--mut); margin:0 0 20px; }
  button { background:#2563eb; color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  ul { list-style:none; padding:0; margin:20px 0 0; }
  li { background:var(--card); border:1px solid var(--bd); border-radius:8px; padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .nome { font-weight:600; }
  .st { font-size:13px; color:var(--mut); text-align:right; white-space:pre-line; }
  .st.ok { color:var(--ok); } .st.err { color:var(--err); }
  #log { margin-top:20px; font-size:13px; color:var(--mut); white-space:pre-wrap; }
  canvas { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Recuperar mapas a partir do PDF salvo</h1>
  <p class="sub">Re-renderiza a imagem dos empreendimentos que ainda têm o PDF de origem no Storage mas perderam a imagem do mapa. Abra esta página logado no sistema.</p>
  <button id="scan">Procurar mapas recuperáveis</button>
  <button id="run" disabled>Recuperar todos</button>
  <ul id="lista"></ul>
  <div id="log"></div>
  <canvas id="cv"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const TOKEN_KEY = "rumo_auth_token";
const token = localStorage.getItem(TOKEN_KEY) || localStorage.getItem("token");
const logEl = document.getElementById("log");
const listaEl = document.getElementById("lista");
const btnScan = document.getElementById("scan");
const btnRun = document.getElementById("run");
let alvos = [];

function log(m) { logEl.textContent += m + "\n"; }

function api(path, init = {}) {
  const headers = new Headers(init.headers || {});
  if (token) headers.set("Authorization", "Bearer " + token);
  if (!headers.has("Content-Type")) headers.set("Content-Type", "application/json");
  return fetch(path, { ...init, headers, credentials: "include", cache: "no-store" });
}

function temImagem(d) {
  return !!(d.mapaImagemUrl || d.mapaImagemBase64 || d.mapaImagemHighResBase64 || d.mapaImagemMedResBase64);
}

async function scan() {
  btnScan.disabled = true;
  logEl.textContent = "";
  listaEl.innerHTML = "";
  try {
    const res = await api("/api/empreendimentos");
    if (res.status === 401) { log("Não autenticado. Faça login no sistema e recarregue esta página."); btnScan.disabled = false; return; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    const itens = rows.map(r => ({ id: r.id || r.data?.id, data: r.data || r }));

    alvos = itens.filter(i => i.data && i.data.mapaPdfUrl && !temImagem(i.data) && i.data.mapaRecortado !== true);
    const semPdf = itens.filter(i => i.data && !i.data.mapaPdfUrl && !temImagem(i.data) && (i.data.mapaPontos || []).length > 0);

    if (!alvos.length) log("Nenhum empreendimento recuperável automaticamente.");
    alvos.forEach((a, idx) => {
      const li = document.createElement("li");
      li.innerHTML = '<span class="nome"></span><span class="st" id="st' + idx + '">pendente</span>';
      li.querySelector(".nome").textContent = a.data.nome || a.id;
      listaEl.appendChild(li);
    });

    if (semPdf.length) {
      log("\nSem PDF de origem — precisam de novo upload manual do mapa:");
      semPdf.forEach(i => log("  • " + (i.data.nome || i.id) + "  (" + (i.data.mapaPontos || []).length + " bolinhas preservadas)"));
    }
    btnRun.disabled = alvos.length === 0;
  } catch (e) {
    log("Erro ao listar: " + (e.message || e));
  }
  btnScan.disabled = false;
}

async function renderPdf(buffer, pagina, scale) {
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  const page = await pdf.getPage(Math.min(pagina || 1, pdf.numPages));
  const viewport = page.getViewport({ scale });
  const cv = document.getElementById("cv");
  cv.width = Math.round(viewport.width);
  cv.height = Math.round(viewport.height);
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  await page.render({ canvasContext: ctx, viewport }).promise;
  const dataUrl = cv.toDataURL("image/webp", 0.92);
  return { dataUrl, width: cv.width, height: cv.height };
}

async function recuperar() {
  btnRun.disabled = true;
  for (let i = 0; i < alvos.length; i++) {
    const { id, data } = alvos[i];
    const st = document.getElementById("st" + i);
    try {
      st.textContent = "baixando PDF…"; st.className = "st";
      const res = await fetch(data.mapaPdfUrl);
      if (!res.ok) throw new Error("PDF HTTP " + res.status);
      const buf = await res.arrayBuffer();

      st.textContent = "renderizando…";
      const { dataUrl, width, height } = await renderPdf(buf, data.mapaPdfPagina, 2.0);

      st.textContent = "salvando imagem…";
      const r1 = await api("/api/empreendimentos/" + id + "/mapa", {
        method: "PUT",
        body: JSON.stringify({ mapaImagemBase64: dataUrl }),
      });
      if (!r1.ok) throw new Error("salvar mapa HTTP " + r1.status);

      const isLandscape = width > height;
      const r2 = await api("/api/empreendimentos/" + id, {
        method: "PUT",
        body: JSON.stringify({
          id,
          mapaImagemNaturalWidth: width,
          mapaImagemNaturalHeight: height,
          mapaOrientacao: isLandscape ? "landscape" : "portrait",
          mapaMarkerReferenceWidth: data.mapaMarkerReferenceWidth || (isLandscape ? 1123 : 794),
        }),
      });
      if (!r2.ok) throw new Error("salvar metadados HTTP " + r2.status);

      st.textContent = "recuperado\n" + width + "×" + height + "px";
      st.className = "st ok";
    } catch (e) {
      st.textContent = "falhou\n" + (e.message || e);
      st.className = "st err";
    }
  }
  log("\nConcluído. Recarregue o sistema para ver os mapas.");
  btnRun.disabled = false;
}

btnScan.addEventListener("click", scan);
btnRun.addEventListener("click", recuperar);
if (!token) log("Aviso: nenhum token encontrado no localStorage deste domínio. Faça login no sistema primeiro.");
</script>
</body>
</html>
